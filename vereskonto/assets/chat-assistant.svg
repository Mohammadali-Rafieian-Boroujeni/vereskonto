<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shop assistant">
  <defs>
    <linearGradient id="vkla-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fc163"/>
      <stop offset="1" stop-color="#0e6b2f"/>
    </linearGradient>
    <linearGradient id="vkla-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f5ec"/>
    </linearGradient>
    <linearGradient id="vkla-visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16323a"/>
      <stop offset="1" stop-color="#0b1d22"/>
    </linearGradient>
  </defs>
  <!-- Background disc -->
  <circle cx="32" cy="32" r="32" fill="url(#vkla-bg)"/>
  <circle cx="22" cy="14" r="18" fill="#ffffff" opacity=".10"/>
  <!-- Antenna -->
  <path d="M32 13.5V9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="7.6" r="3" fill="#ffd34d"/>
  <!-- Headset band -->
  <path d="M14.5 33a17.5 17.5 0 0 1 35 0" fill="none" stroke="#0b3d1d" stroke-width="3.2" stroke-linecap="round" opacity=".55"/>
  <!-- Head -->
  <rect x="16.5" y="15" width="31" height="28" rx="12" fill="url(#vkla-face)"/>
  <!-- Visor with smiling eyes -->
  <rect x="20.5" y="21" width="23" height="13.5" rx="6.75" fill="url(#vkla-visor)"/>
  <path d="M25.6 28.6q2-2.6 4 0M34.4 28.6q2-2.6 4 0" fill="none" stroke="#5ff59a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="21.6" cy="38" r="1.7" fill="#ff9aa8" opacity=".75"/>
  <circle cx="42.4" cy="38" r="1.7" fill="#ff9aa8" opacity=".75"/>
  <!-- Ear cups -->
  <rect x="11.5" y="27" width="6.5" height="11" rx="3.25" fill="#ffd34d"/>
  <rect x="46" y="27" width="6.5" height="11" rx="3.25" fill="#ffd34d"/>
  <!-- Microphone -->
  <path d="M15 37.5q1 7.5 10.5 8" fill="none" stroke="#ffd34d" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="26.2" cy="45.5" r="2.2" fill="#ffd34d"/>
  <!-- Body / shoulders -->
  <path d="M19 64v-6.5c0-5 4.5-8.5 13-8.5s13 3.5 13 8.5V64z" fill="#ffffff" opacity=".95"/>
  <!-- Chat bubble -->
  <path d="M43 46.5h11a3.5 3.5 0 0 1 3.5 3.5v5.5a3.5 3.5 0 0 1-3.5 3.5h-5.5l-3.6 3v-3H43a3.5 3.5 0 0 1-3.5-3.5V50a3.5 3.5 0 0 1 3.5-3.5z" fill="#ffffff"/>
  <circle cx="44.8" cy="52.8" r="1.25" fill="#157f3a"/>
  <circle cx="48.5" cy="52.8" r="1.25" fill="#157f3a"/>
  <circle cx="52.2" cy="52.8" r="1.25" fill="#157f3a"/>
</svg>
